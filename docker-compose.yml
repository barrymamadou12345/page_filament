# 4. docker-compose.yml
services:
  web:
    build: .
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=mysql-backend-09vk.onrender.com
      - DB_PORT=3306
      - DB_DATABASE=my_database
      - DB_USERNAME=mysql
      - DB_PASSWORD=RenderMysqlPassword
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    restart: unless-stopped

volumes:
  storage: